[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pqa"
version = "0.1.0"
description = "Parliamentary Q&A (PSP) — RAG proof of concept"
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.3",
    "langchain-core>=1.6",
    "langchain-community>=0.4",
    "langchain-openai>=1.6",
    "langchain-classic>=1.0",
    "faiss-cpu>=1.15",
    "rank-bm25>=0.2.2",
    "python-dotenv>=1.0",
]

[tool.setuptools]
packages = ["pqa"]
py-modules = ["cli", "evaluation", "metrics"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.ruff]
line-length = 120
